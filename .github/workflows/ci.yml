name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # The Node in .node-version, not whatever the runner has.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The tools at the versions and hashes in requirements-dev.txt.
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      # The core's parts in src/core/ are one function in pieces, so they are
      # checked joined (as the build joins them), not one by one.
      - name: JavaScript syntax
        run: |
          node -e "require('./tests/js/load-core.js')"
          for f in src/app/*.js; do node --check "$f"; done
      # The page's pure logic (src/core/), on Node's built-in test runner.
      - name: JavaScript tests
        run: node --test tests/js/core.test.js

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # 3.11.8 exactly: the oldest Python the server takes, and what the
        # operators' machines have.
        python: ["3.11.8", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Operators run this on Windows laptops; make sure it works there,
          # on the oldest Python the server takes too.
          - os: windows-latest
            python: "3.11.8"
          - os: windows-latest
            python: "3.13"
          - os: windows-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

  browser:
    name: Browser tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows too: that is where the team opens the page.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.15"]
        include:
          # And once on the server's oldest Python, 3.11.8 exactly.
          - os: ubuntu-24.04
            python: "3.11.8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The page's DOM layer, driven in a real Chromium against the built server.
      - run: pip install --require-hashes -r requirements-browser.txt
      - if: runner.os == 'Linux'
        run: playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: playwright install chromium
      - run: python -m unittest tests.test_browser -v

  build:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Build
        run: python -W error scripts/build.py
      - name: Smoke test the built server
        run: |
          python dist/salt_sync_server.py --no-browser --no-minimize \
            --port 8080 --viewer-port 8081 --no-access-code &
          # HTTPS by default, with a self-signed certificate (-k accepts it).
          for i in $(seq 1 40); do curl -kfs https://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done
          curl -kfsS https://127.0.0.1:8080/ | grep -q '<style>'
          curl -kfsS https://127.0.0.1:8081/ | grep -q 'class="read-only"'
          curl -kfsS https://127.0.0.1:8080/api/sync | python -c "import json,sys; d=json.load(sys.stdin); assert d['read_only'] is False"
          test "$(curl -ks -o /dev/null -w '%{http_code}' -X POST -d '{}' https://127.0.0.1:8081/api/save_config)" = 405
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/)" = "307 https://127.0.0.1:8080/"
          echo "smoke test passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SaltReportWorkbench-dist
          path: dist/
          if-no-files-found: error

  # What operators get, used the way they use it: the release zip and the
  # one-file .txt, built from this checkout, extracted and started on Windows
  # with Python 3.11.8, the Python their laptops have.
  shipped:
    name: Shipped release (Python 3.11.8, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.8"
      # --allow-dirty: a pull request or main is not a release tag.
      - name: Build the release
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"], end="")')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python scripts/release.py "$version" -o out --allow-dirty
      - name: Extract the zip
        shell: pwsh
        run: Expand-Archive "out/SaltReportWorkbench-v$env:VERSION.zip" -DestinationPath check/zip
      - name: Unpack the .txt and compare
        run: |
          mkdir check/txt
          cp "out/SALT-Workbench-v$VERSION.txt" check/txt/
          python -I "check/txt/SALT-Workbench-v$VERSION.txt"
          diff -r "check/zip/SaltReportWorkbench-v$VERSION" "check/txt/SALT Report Workbench"
          echo "The .txt unpacks to the zip's files."
      # Through the launcher, with the Python named in SALT_PYTHON as the
      # launcher allows, so it is this 3.11.8. HTTPS and an access code, as
      # operators run it; /api/health needs no code. Started, checked and
      # stopped in one step, so no step ends with the server still running.
      - name: Start the extracted server and check /api/health
        shell: pwsh
        timeout-minutes: 5
        run: |
          $check = @'
          import json, ssl, sys, time, urllib.request
          # The server's own self-signed certificate, as on the operators' LAN.
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          deadline = time.monotonic() + 120  # it makes its TLS key first
          while True:
              try:
                  with urllib.request.urlopen(sys.argv[1], context=ctx, timeout=10) as r:
                      health = json.load(r)
                  break
              except OSError as exc:
                  if time.monotonic() > deadline:
                      sys.exit(f"No answer from {sys.argv[1]}: {exc}")
                  time.sleep(1)
          print(health)
          if health["version"] != sys.argv[2] or health["status"] != "ok":
              sys.exit(f"Expected version {sys.argv[2]} and status ok")
          '@
          $port = python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])"
          $env:SALT_PYTHON = (Get-Command python).Source
          $env:PYTHONUNBUFFERED = "1"  # so the log below has the server's lines
          $server = Start-Process cmd.exe -PassThru -NoNewWindow `
            -WorkingDirectory "check/zip/SaltReportWorkbench-v$env:VERSION" `
            -ArgumentList "/c call `".\Start SALT Workbench.bat`" --no-browser --no-minimize --port $port --viewer-port 0" `
            -RedirectStandardOutput "$env:RUNNER_TEMP/server.out" -RedirectStandardError "$env:RUNNER_TEMP/server.err"
          $server.Id | Set-Content "$env:RUNNER_TEMP/server.pid"
          try {
            $check | python - "https://127.0.0.1:$port/api/health" $env:VERSION
            $healthy = $LASTEXITCODE -eq 0
          } finally {
            taskkill /F /T /PID $server.Id
          }
          Get-Content "$env:RUNNER_TEMP/server.out", "$env:RUNNER_TEMP/server.err"
          if (-not $healthy) { exit 1 }
          exit 0
      # In case the step above was cut off with the server still running.
      - name: Stop the server
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP/server.pid"
          if (Test-Path $pidFile) { taskkill /F /T /PID (Get-Content $pidFile) }
          exit 0
