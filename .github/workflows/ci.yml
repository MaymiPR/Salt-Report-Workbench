name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.2
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: JavaScript syntax
        run: for f in src/core.js src/app/*.js; do node --check "$f"; done
      # The page's pure logic (src/core.js), on Node's built-in test runner.
      - name: JavaScript tests
        run: node --test tests/js/core.test.js

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Operators run this on Windows laptops; make sure it works there.
          - os: windows-latest
            python: "3.13"
          - os: windows-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The page's DOM layer, driven in a real Chromium against the built server.
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python -m unittest tests.test_browser -v

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        run: python -W error scripts/build.py
      - name: Smoke test the built server
        run: |
          python dist/salt_sync_server.py --no-browser --no-minimize \
            --port 8080 --viewer-port 8081 --no-access-code &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<style>'
          curl -fsS http://127.0.0.1:8081/ | grep -q 'class="read-only"'
          curl -fsS http://127.0.0.1:8080/api/sync | python -c "import json,sys; d=json.load(sys.stdin); assert d['read_only'] is False"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:8081/api/save_config)" = 405
          echo "smoke test passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SaltReportWorkbench-dist
          path: dist/
          if-no-files-found: error
