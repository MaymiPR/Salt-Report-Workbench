name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # The Node in .node-version, not whatever the runner has.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The tools at the versions and hashes in requirements-dev.txt.
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      # The core's parts in src/core/ are one function in pieces, so they are
      # checked joined (as the build joins them), not one by one.
      - name: JavaScript syntax
        run: |
          node -e "require('./tests/js/load-core.js')"
          for f in src/app/*.js; do node --check "$f"; done
      # The page's pure logic (src/core/), on Node's built-in test runner.
      - name: JavaScript tests
        run: node --test tests/js/core.test.js

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # 3.11.8 exactly: the oldest Python the server takes, and what the
        # operators' machines have.
        python: ["3.11.8", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Operators run this on Windows laptops; make sure it works there,
          # on the oldest Python the server takes too.
          - os: windows-latest
            python: "3.11.8"
          - os: windows-latest
            python: "3.13"
          - os: windows-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

  browser:
    name: Browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows too: that is where the team opens the page.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # The page's DOM layer, driven in a real Chromium against the built server.
      - run: pip install --require-hashes -r requirements-browser.txt
      - if: runner.os == 'Linux'
        run: playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: playwright install chromium
      - run: python -m unittest tests.test_browser -v

  build:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Build
        run: python -W error scripts/build.py
      - name: Smoke test the built server
        run: |
          python dist/salt_sync_server.py --no-browser --no-minimize \
            --port 8080 --viewer-port 8081 --no-access-code &
          # HTTPS by default, with a self-signed certificate (-k accepts it).
          for i in $(seq 1 40); do curl -kfs https://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done
          curl -kfsS https://127.0.0.1:8080/ | grep -q '<style>'
          curl -kfsS https://127.0.0.1:8081/ | grep -q 'class="read-only"'
          curl -kfsS https://127.0.0.1:8080/api/sync | python -c "import json,sys; d=json.load(sys.stdin); assert d['read_only'] is False"
          test "$(curl -ks -o /dev/null -w '%{http_code}' -X POST -d '{}' https://127.0.0.1:8081/api/save_config)" = 405
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/)" = "307 https://127.0.0.1:8080/"
          echo "smoke test passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SaltReportWorkbench-dist
          path: dist/
          if-no-files-found: error
