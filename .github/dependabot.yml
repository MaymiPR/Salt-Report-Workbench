# The app has no runtime dependencies; the only third-party code is the
# GitHub Actions used by CI and the development tools (ruff, pre-commit,
# Playwright). Keep those current. Actions are pinned to commit SHAs (with the
# version in a comment); the tools to versions and hashes in requirements-*.txt
# (made from requirements-*.in by pip-compile); the pre-commit hooks to commit
# SHAs (with the version in a "# frozen:" comment). Dependabot updates all three.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      dev-tools:
        patterns: ["*"]
    # pyee 14 needs Python 3.12, and the browser tests run on 3.11.8 too (see
    # requirements-browser.in); without this, Dependabot could raise the
    # pyee<14 bound there.
    ignore:
      - dependency-name: pyee
        versions: [">=14"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
