[project]
name = "salt-report-workbench"
version = "2.40.0"
description = "Offline-first tactical SALT reporting workbench with real-time LAN sync."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11.8"
# Deliberately empty: the server and build use only the standard library so the
# tool runs on air-gapped machines with nothing but a stock Python install.
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax for the target version
    "I",        # import sorting
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is the formatter's job
    "RUF001",   # the UI and manual use typographic glyphs on purpose
    "RUF002",
    "RUF003",
    # datetime.UTC is 3.11+. The server imports run before its version check,
    # so an older Python would stop at the import instead of being told why;
    # timezone.utc works on every version.
    "UP017",
]

[tool.ruff.lint.isort]
# The scripts and the server are imported by path in the tests. Naming them
# keeps the import order the same on every machine, whatever folders (a local
# release/ or build/, say) sit beside them.
known-first-party = ["build", "bump", "pack", "release", "salt_sync_server"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "preserve"
